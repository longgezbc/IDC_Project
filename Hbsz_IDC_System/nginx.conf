# ============================================================================
# Nginx 配置 - 前端静态资源服务 + 后端 API 反向代理
# ============================================================================
# P1-4.6 安全加固说明：
#   - 监听非特权端口 8080（>1024），允许 nginx 用户（非 root）绑定
#   - 注：pid 文件路径由主配置 /etc/nginx/nginx.conf 决定（默认 /var/run/nginx.pid）
#         docker-compose 已将 /var/run 挂载为 tmpfs，可写
#   - 注：上游 backend 反向代理路径不变
# ============================================================================

server {
    listen       8080;
    server_name  _;

    # 静态资源根目录
    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip 压缩配置
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        font/woff
        font/woff2;

    # 静态资源缓存策略（带 hash 的资源永久缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html 不缓存（保证发布后即时生效）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ----------------------------------------------------------------
    # 拦截敏感路径（.env / git 等），防止信息泄露
    # 注：正则仅对非 /api/ 路径生效——/api/ 走下方 ^~ 前缀匹配（^~ 命中后不评估正则）
    # ----------------------------------------------------------------
    location ~* /\.(env|git|htaccess|htpasswd) {
        return 404;
    }

    # ----------------------------------------------------------------
    # Actuator 端点管控（W1 修复：原正则 /api/(actuator/(?!health)) 被 ^~ /api/
    # 前缀匹配短路，从未生效。Nginx 优先级：= 精确匹配最高，^~ 之间按最长前缀决胜）
    #   /api/actuator/health → 精确匹配，正常代理（供外部探活）
    #   /api/actuator 及其余子路径 → 命中更长前缀，一律 404
    # ----------------------------------------------------------------
    location = /api/actuator/health {
        proxy_pass http://backend:8080/api/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }
    location ^~ /api/actuator {
        return 404;
    }

    # ----------------------------------------------------------------
    # P0-4.2 安全加固：拦截可执行文件扩展名
    # 即使后端 FileStorageServiceImpl 已有扩展名白名单 + magic number 校验，
    # 这里作为纵深防御，防止因配置错误或路径绕过导致 WebShell 落地后被解析执行。
    # 规则：匹配 .php/.jsp/.asp/.aspx/.sh/.cgi/.pl/.py/.exe/.bat/.cmd/.dll/.so 等
    # ----------------------------------------------------------------
    location ~* \.(php|jsp|asp|aspx|ashx|cgi|pl|py|exe|bat|cmd|sh|dll|so|war|jar)$ {
        return 404;
    }

    # ----------------------------------------------------------------
    # 后端 API 反向代理
    # ----------------------------------------------------------------
    # 注意：必须使用 ^~ 前缀匹配，优先级高于正则匹配（如 \.png$）。
    # 否则 /api/files/preview/xxx.png 会被静态资源规则截获，返回 404。
    location ^~ /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 文件上传大小限制（与后端 100MB 保持一致）
        client_max_body_size 100m;

        # 超时配置
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲区配置
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
    }

    # ----------------------------------------------------------------
    # WebSocket 反向代理（站内通知实时推送）
    # ----------------------------------------------------------------
    location ^~ /ws/ {
        proxy_pass http://backend:8080/api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket 长连接超时
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ----------------------------------------------------------------
    # SPA 路由回退：所有未匹配的路由返回 index.html
    # ----------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ws: wss:" always;

    # 隐藏 Nginx 版本号
    server_tokens off;
}
