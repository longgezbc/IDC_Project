# ============================================================================
# Grafana 配置文件
# ============================================================================

[server]
# 监听端口
http_port = 3000
# 对外访问的域名（如有域名可修改）
;domain = localhost

[security]
# 初始管理员账号（首次登录使用，登录后请修改）
admin_user = admin
# admin_password 由 docker-compose.monitoring.yml 的 GF_SECURITY_ADMIN_PASSWORD 环境变量注入
# 此处不再硬编码，避免弱密码 admin123 入库（安全加固）
;admin_password = admin123

[auth]
# 禁用登录表单（不建议，保持开启）
;disable_login_form = false

[analytics]
# 关闭使用情况报告
reporting_enabled = false
check_for_updates = false

[dashboards]
# 首页默认仪表盘
;default_home_dashboard_path = /dashboards/home

[smtp]
# 告警邮件配置（需要时启用）
;enabled = false
