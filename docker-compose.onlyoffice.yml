# ============================================================================
# OnlyOffice Document Server - 在线编辑（可选启用）
# ============================================================================
# 启用方式：
#   docker compose --env-file .env.docker \
#     -f docker-compose.yml -f docker-compose.onlyoffice.yml up -d onlyoffice
# 单独启动 onlyoffice（主服务已运行时）：
#   docker compose --env-file .env.docker -f docker-compose.onlyoffice.yml up -d onlyoffice
#
# 资源说明：OnlyOffice DS 建议 ≥2GB 内存。当前 2G 服务器紧张，
#           建议部署在独立机器，或仅在小范围测试时启动。
# .env.docker 需新增：
#   ONLYOFFICE_JWT_SECRET=<openssl rand -base64 32>
#   ONLYOFFICE_PORT=8082
# ============================================================================
services:
  onlyoffice:
    image: onlyoffice/documentserver:8.2.2
    container_name: hbsz-onlyoffice
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      JWT_ENABLED: ${ONLYOFFICE_JWT_ENABLED:-true}
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?ONLYOFFICE_JWT_SECRET is required (set in .env.docker)}
      USE_UNAUTHORIZED_STORAGE: "true"
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-logs:/var/log/onlyoffice
      - onlyoffice-cache:/var/lib/onlyoffice
    ports:
      # 仅本机访问，前端通过 Nginx 反代 /onlyoffice/ 到此端口
      - "127.0.0.1:${ONLYOFFICE_PORT:-8082}:80"
    networks:
      - hbsz-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M

volumes:
  onlyoffice-data:
    name: hbsz-onlyoffice-data
  onlyoffice-logs:
    name: hbsz-onlyoffice-logs
  onlyoffice-cache:
    name: hbsz-onlyoffice-cache

networks:
  hbsz-network:
    external: true
