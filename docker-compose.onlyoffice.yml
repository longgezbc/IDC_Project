# ============================================================================
# OnlyOffice Document Server 编排文件（文档在线编辑，可选部署）
# ============================================================================
# 使用方式（与主栈同机部署）：
#   首次：docker compose -f docker-compose.onlyoffice.yml --env-file .env.docker up -d
#   注意：镜像约 3GB，首次拉取耗时较长
#
# 说明：
#   - JWT_SECRET 必须与后端 .env.docker 的 ONLYOFFICE_JWT_SECRET 一致
#   - 加入已存在的外部网络 hbsz-network（主 compose 创建），DS 容器可通过
#     http://backend:8080 访问后端 API（拉取文档/保存回调）
#   - 浏览器通过宿主机 8082 端口访问 DS（后端 ONLYOFFICE_SERVER_URL 需与之对应）
# ============================================================================

services:
  onlyoffice:
    image: onlyoffice/documentserver:8.1.3
    container_name: hbsz-onlyoffice
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?ONLYOFFICE_JWT_SECRET is required (set in .env.docker)}
      TZ: Asia/Shanghai
    ports:
      - "8082:80"
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-log:/var/log/onlyoffice
    networks:
      - hbsz-network
    # DS 首次启动需初始化字体/数据库，耗时 1-2 分钟
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    stop_grace_period: 60s

networks:
  hbsz-network:
    external: true
    name: hbsz-network

volumes:
  onlyoffice-data:
    name: hbsz-onlyoffice-data
  onlyoffice-log:
    name: hbsz-onlyoffice-log
