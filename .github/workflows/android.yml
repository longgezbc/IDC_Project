# ============================================================
# Android CI（Hbsz_app_Android — Kotlin 2.0 + Compose + Gradle 8.13）
#
# 触发条件：
#   - push / pull_request 到 main 分支，且改动涉及 Android 目录或本工作流文件
#   - 支持在 Actions 页面手动触发（workflow_dispatch）
#
# 构建说明：
#   CI 仅构建 debug 变体——release 签名密钥 hbsz-release.jks 已通过
#   .gitignore 排除（防止签名密钥泄漏导致应用被恶意覆盖安装），
#   生产发布仍在本地签名。debug 构建自动使用调试签名，无需任何密钥。
#
# 执行流程：
#   1. 检出代码
#   2. 安装 Temurin JDK 17（AGP 8.13 要求 JDK 17+）
#   3. Gradle 官方 action：校验 wrapper + 自动缓存依赖
#   4. JVM 单元测试（无需设备/模拟器）
#   5. 构建 Debug APK
#   6. 上传 APK 构建产物（保留 7 天）
# ============================================================
name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'Hbsz_app_Android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Hbsz_app_Android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch: {}

# 同一分支的新推送自动取消旧任务，节省额度
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: UnitTest + Debug Build (Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Hbsz_app_Android
    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 JDK 17（AGP 8.13 要求）
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Gradle 环境（自动按 wrapper 校验 + 缓存依赖）
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Windows 提交的 gradlew 可能丢失可执行位，先补上
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. JVM 单元测试（src/test，无需设备）
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # 5. 构建 Debug APK（调试签名，无需生产密钥）
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 6. 上传 Debug APK
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: Hbsz_app_Android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
