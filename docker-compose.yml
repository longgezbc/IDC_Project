# ============================================================================
# 数据中心综合布线项目管理系统 - Docker Compose 编排文件
# 适用：2核2G 轻量云服务器（本地构建产物上传部署）
# ============================================================================
# 内存分配（总计约 780MB，为系统预留约 1.2GB）：
#   MySQL  : 400MB (buffer_pool=128M)
#   Redis  :  80MB (maxmemory=48mb)
#   后端   : 288MB (JVM堆 96-160m + 元空间/线程栈/堆外)
#   前端   :  32MB
# 说明：2G 服务器内存紧张，后端 JVM 启动峰值易触发 OOM Killer，
#       降低堆上限并使用 SerialGC（小堆场景更省内存），预留启动余量。
# ============================================================================
# 使用方式：
#   首次启动：docker compose --env-file .env.docker up -d --build
#   查看状态：docker compose ps
#   查看日志：docker compose logs -f backend
#   停止服务：docker compose down
#
# W3 安全修复：敏感凭据（MYSQL_ROOT_PASSWORD / DB_PASSWORD / REDIS_PASSWORD / JWT_SECRET）
# 使用 ${VAR:?required} 强制形式——未在 .env.docker 中设置时 compose 直接报错拒绝启动，
# 杜绝弱默认值静默上生产。因此所有 compose 命令（含 down/logs/ps）都必须带
# --env-file .env.docker，否则变量缺失会导致命令解析失败。
# ============================================================================

services:
  # ==========================================================================
  # 1. MySQL 数据库
  # ==========================================================================
  # 安全说明（P1-4.6）：
  #   - MySQL 容器需要 CHOWN/SETUID/SETGID/DAC_OVERRIDE 等能力切换 mysql 用户并访问数据卷
  #     不能 cap_drop: ALL，否则容器启动失败
  #   - 仅添加 no-new-privileges 防止子进程提权
  #   - 镜像版本固定到 8.0.40（LTS），避免拉取到含新 CVE 的滚动 tag
  #   - 生产环境务必通过 .env.docker 覆盖 MYSQL_ROOT_PASSWORD（默认值仅用于本地测试）
  mysql:
    image: mysql:8.0.40
    container_name: hbsz-mysql
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required (set in .env.docker)}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hbsz_idc_system}
      # 安全加固（P2-4）：healthcheck 通过 MYSQL_PWD 环境变量认证，避免密码出现在
      # docker inspect 输出与容器进程列表（ps）中。MYSQL_PWD 被 mysqladmin 等 client 读取。
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    # 如需外部连接数据库，取消下方注释（注意安全风险）
    # ports:
    #   - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/mysql/02-seed-data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql:ro
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - hbsz-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 400M
          cpus: '1.0'
        reservations:
          memory: 256M
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --max-connections=100
      --innodb-buffer-pool-size=128M
      --innodb-log-file-size=64M
      --slow-query-log=ON
      --long-query-time=3
      --skip-name-resolve

  # ==========================================================================
  # 2. MySQL 权限初始化（一次性任务）
  # ==========================================================================
  # 作用：每次部署都执行 GRANT 语句 + 同步 hbsz_app 密码
  # 解决：
  #   - MySQL 数据卷复用时 01-schema.sql 不重新执行导致权限缺失
  #   - 01-schema.sql 中硬编码的密码与 .env.docker 中 DB_PASSWORD 不一致
  #     导致后端连接被 Access denied 拒绝
  # 安全：使用 root 账号连接，执行完毕后容器自动退出
  mysql-grants:
    image: mysql:8.0.40
    container_name: hbsz-mysql-grants
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required (set in .env.docker)}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required (set in .env.docker)}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:?FLYWAY_PASSWORD is required (set in .env.docker)}
    volumes:
      - ./docker/mysql/init-grants.sql:/init-grants.sql:ro
    entrypoint:
      - bash
      - -c
      - |
        echo "Waiting for MySQL to be ready..."
        for i in $(seq 1 30); do
          if mysqladmin -h mysql -u root ping >/dev/null 2>&1; then
            echo "MySQL is responding, executing grants..."
            break
          fi
          echo "Attempt $$i/30: MySQL not ready, waiting 2s..."
          sleep 2
        done
        # 先同步 hbsz_app 密码为 .env.docker 中的 DB_PASSWORD
        # 根因修复：01-schema.sql 硬编码 hbsz_app_2026，与 .env.docker 不一致
        # 注：不用 -v，避免密码泄露到容器日志
        mysql -h mysql -u root -e "ALTER USER 'hbsz_app'@'%' IDENTIFIED BY '${DB_PASSWORD}';"
        # 同步 hbsz_migrate 密码为 .env.docker 中的 FLYWAY_PASSWORD（Flyway 迁移账号，P1-2 账号分离）
        mysql -h mysql -u root -e "ALTER USER 'hbsz_migrate'@'%' IDENTIFIED BY '${FLYWAY_PASSWORD}';"
        # 再执行权限初始化
        mysql -h mysql -u root -v < /init-grants.sql
        RESULT=$$?
        if [ $$RESULT -eq 0 ]; then
          echo "Grants applied successfully."
          exit 0
        else
          echo "Grants application failed with exit code $$RESULT"
          exit $$RESULT
        fi
    restart: "no"
    networks:
      - hbsz-network

  # ==========================================================================
  # 3. Redis 缓存
  # ==========================================================================
  # 安全说明（P1-4.6）：
  #   - redis:alpine 默认以 root 启动但内部会切换到 redis 用户
  #   - 仅添加 no-new-privileges，不强制 cap_drop（redis-server 需要绑定 6379 端口）
  #   - 镜像版本固定到 7.2-alpine
  redis:
    image: redis:7.2-alpine
    container_name: hbsz-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # 安全加固（P2-4）：redis-cli 通过 REDISCLI_AUTH 环境变量认证，避免密码出现在 ps / docker inspect 中。
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required (set in .env.docker)}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required (set in .env.docker)}
      --maxmemory 48mb
      --maxmemory-policy allkeys-lru
      --save 300 10
      --appendonly yes
      --appendfsync everysec
    # ports:
    #   - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - hbsz-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 80M
          cpus: '0.5'
        reservations:
          memory: 48M

  # ==========================================================================
  # 3. 后端 API 服务（使用本地构建的 JAR 包）
  # ==========================================================================
  # 安全说明（P1-4.6）：
  #   - cap_drop: ALL 移除所有 Linux capabilities，JVM 不需要任何特权能力
  #   - read_only: true 文件系统只读，写入仅限 /app/uploads 和 /app/logs 命名卷
  #   - tmpfs 挂载 /tmp 用于 JVM 临时文件（如压缩解压、字节码缓存）
  #   - 容器内以非 root 用户 appuser 运行（见 Dockerfile）
  backend:
    build:
      context: ./Hbsz_IDC_System_end
      dockerfile: Dockerfile
    container_name: hbsz-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64M
      - /var/cache/fontconfig:size=16M
      - /app/.cache/fontconfig:size=16M
      - /app/.fontconfig:size=16M
      - /app/exports:size=128M
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql-grants:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-hbsz_idc_system}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=10000"
      DB_USERNAME: ${DB_USERNAME:-hbsz_app}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required (set in .env.docker)}
      # Flyway 迁移账号（P1-2 账号分离）：迁移用 hbsz_migrate，运行时 datasource 用 hbsz_app
      FLYWAY_USERNAME: ${FLYWAY_USERNAME:-hbsz_migrate}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:?FLYWAY_PASSWORD is required (set in .env.docker)}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required (set in .env.docker)}
      REDIS_DB: 0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (set in .env.docker)}
      JWT_EXPIRATION: 1800000
      JWT_REFRESH_EXPIRATION: 604800000
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-https://hbsz.example.com}"
      # 受信反向代理白名单（精确 IP 或 CIDR，逗号分隔）：Nginx 容器所在的 docker 网段。
      # 配置后限流/审计/登录IP才会采信 X-Forwarded-For 取真实客户端 IP；为空则一律按代理 IP 计数。
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      HBSZ_FILE_UPLOAD_DIR: /app/uploads
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms96m -Xmx160m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -XX:ThreadStackSize=512k -XX:+UseSerialGC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/heapdump.hprof"
    ports:
      # 仅绑定本机回环：公网无法直连 8080，App/Web 统一走 nginx 80 端口反代
      # （服务器本机调试仍可用 127.0.0.1:8080；nginx 反代走容器网络 backend:8080 不受影响）
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads-data:/app/uploads
      - logs-data:/app/logs
    networks:
      - hbsz-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 288M
        reservations:
          memory: 192M

  # ==========================================================================
  # 4. 前端 Web 服务（使用本地构建的 dist 目录）
  # ==========================================================================
  # 安全说明（P1-4.6）：
  #   - cap_drop: ALL + no-new-privileges 防止容器逃逸
  #   - read_only: true，nginx 仅需 /tmp 与 /var/cache/nginx 可写（tmpfs 提供）
  #   - nginx 容器内以 nginx 用户运行（非 root），监听非特权端口 8080
  #   - 镜像版本固定到 1.27-alpine
  #   - 宿主机端口默认仍为 80（通过 docker 端口映射到容器内 8080）
  frontend:
    build:
      context: ./Hbsz_IDC_System
      dockerfile: Dockerfile
    container_name: hbsz-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16M
      - /var/cache/nginx:size=16M
      - /var/run:size=1M
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    networks:
      - hbsz-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: '0.25'
        reservations:
          memory: 16M

# ============================================================================
# 网络
# ============================================================================
networks:
  hbsz-network:
    driver: bridge
    name: hbsz-network

# ============================================================================
# 数据卷
# ============================================================================
volumes:
  mysql-data:
    name: hbsz-mysql-data
  redis-data:
    name: hbsz-redis-data
  uploads-data:
    name: hbsz-uploads-data
  logs-data:
    name: hbsz-logs-data
